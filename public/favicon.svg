<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RankPilot">
  <title>RankPilot</title>
  <!--
    Favicons render outside the document, so CSS custom properties are unavailable.
    The previous version filled the background with a CSS variable, which resolved to
    nothing and left the mark transparent. All colours here are literal.
  -->
  <defs>
    <linearGradient id="rp-fav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#rp-fav)"/>

  <!-- Simplified for small sizes: heavier bars, single plane, no inner shading -->
  <g fill="#FFFFFF" opacity="0.38">
    <rect x="11" y="37" width="8" height="16" rx="2.5"/>
    <rect x="22.5" y="29" width="8" height="24" rx="2.5"/>
    <rect x="34" y="21" width="8" height="32" rx="2.5"/>
  </g>
  <path d="M53.4 10.4 42.6 41.6a1.2 1.2 0 0 1-2.22.13l-4.97-10.16a1.2 1.2 0 0 0-.56-.56L24.7 26.04a1.2 1.2 0 0 1 .13-2.22l31.2-10.8a1.2 1.2 0 0 1 1.55 1.55z" fill="#FFFFFF" transform="translate(-4 -1)"/>
</svg>
